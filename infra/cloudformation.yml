AWSTemplateFormatVersion: "2010-09-09"
Description: >
  OmniParse IDP — S3 + CloudFront (UI) and ECS Fargate + ALB (FastAPI).
  Uses an EXISTING company VPC (My-VPC01). Does not create VPC / IGW / NAT / routes.

Parameters:
  ProjectName:
    Type: String
    Default: omniparse-idp
    AllowedPattern: "[a-z0-9-]+"
    Description: Lowercase name prefix for resources

  ExistingVpcId:
    Type: AWS::EC2::VPC::Id
    Description: Company VPC to deploy into (e.g. My-VPC01)

  PublicSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet AZ-a for ALB (IGW route)

  PublicSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet AZ-b for ALB (IGW route)

  PrivateSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet AZ-a for Fargate (NAT route)

  PrivateSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet AZ-b for Fargate (NAT route)

  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional Gemini API key stored in Secrets Manager (UI can still pass a key per request)

  GeminiModel:
    Type: String
    Default: gemini-3.5-flash

  ContainerCpu:
    Type: Number
    Default: 2048
    AllowedValues: [512, 1024, 2048, 4096]
    Description: Fargate task CPU units

  ContainerMemory:
    Type: Number
    Default: 4096
    AllowedValues: [1024, 2048, 4096, 8192, 16384]
    Description: Fargate task memory (MiB)

  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 4
    Description: Set 0 on first infra create (before the first image push), then 1

  ImageTag:
    Type: String
    Default: latest
    Description: ECR image tag to run (update after each push)

Resources:
  # ----- Security groups (only new network objects we create) -----
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB ingress HTTP from CloudFront / internet
      VpcId: !Ref ExistingVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP origin for CloudFront

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Fargate tasks - API port from ALB only
      VpcId: !Ref ExistingVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8001
          ToPort: 8001
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  # ----- Secrets -----
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/app"
      Description: OmniParse API secrets (Gemini / future Bedrock)
      SecretString: !Sub
        - '{"GEMINI_API_KEY":"${Key}","GEMINI_MODEL":"${Model}"}'
        - Key: !Ref GeminiApiKey
          Model: !Ref GeminiModel

  # ----- ECR -----
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-api"
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # ----- Logs -----
  # Name includes "-api" so a new stack can create after an orphaned
  # /ecs/${ProjectName} was retained (DELETE_FAILED without logs:DeleteLogGroup).
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      # No RetentionInDays — App@Team may lack logs:PutRetentionPolicy.
      # IT can set retention later in console once permissions allow.
      LogGroupName: !Sub "/ecs/${ProjectName}-api"

  # ----- IAM -----
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-ecs-execution"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref AppSecret

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-ecs-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RuntimeSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref AppSecret
        - PolicyName: ExtractAuditS3
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt AuditBucket.Arn
                  - !Sub "${AuditBucket.Arn}/*"

  # ----- ALB -----
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-alb"
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1Id
        - !Ref PublicSubnet2Id
      SecurityGroups:
        - !Ref AlbSecurityGroup
      # LoadBalancerAttributes omitted — App@Team may lack
      # elasticloadbalancing:ModifyLoadBalancerAttributes.
      # Default idle timeout is 60s; IT can raise to 180s in console later.

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-api"
      VpcId: !Ref ExistingVpcId
      Port: 8001
      Protocol: HTTP
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      # TargetGroupAttributes omitted — App@Team may lack
      # elasticloadbalancing:ModifyTargetGroupAttributes. Default deregistration delay is fine.

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ----- ECS -----
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-cluster"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-api"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref ContainerCpu
      Memory: !Ref ContainerMemory
      EphemeralStorage:
        SizeInGiB: 50
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Sub
            - "${Repo}:${Tag}"
            - Repo: !GetAtt EcrRepository.RepositoryUri
              Tag: !Ref ImageTag
          Essential: true
          PortMappings:
            - ContainerPort: 8001
              Protocol: tcp
          Environment:
            - Name: API_HOST
              Value: "0.0.0.0"
            - Name: API_PORT
              Value: "8001"
            # Require sign-in for extract + Copilot on the live API.
            - Name: AUTH_REQUIRED
              Value: "true"
            # Models Global Admin can assign to users.
            - Name: MODEL_CATALOG
              Value: "gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.5-flash,gemini-3.1-pro-preview,gemini-2.5-flash,gemini-2.5-pro"
            # CloudFront is same-origin for /api; localhost kept for local UI testing.
            - Name: CORS_ORIGINS
              Value: !Sub "http://localhost:8000,http://127.0.0.1:8000,https://${CloudFrontDistribution.DomainName}"
            - Name: GEMINI_MODEL
              Value: !Ref GeminiModel
            # Durable admin extract outcome logs (survives task redeploy).
            - Name: EXTRACT_AUDIT_S3_BUCKET
              Value: !Ref AuditBucket
          Secrets:
            - Name: GEMINI_API_KEY
              ValueFrom: !Sub "${AppSecret}:GEMINI_API_KEY::"
            # Stable signing key so redeploys do not invalidate active sessions.
            - Name: JWT_SECRET
              ValueFrom: !Sub "${AppSecret}:JWT_SECRET::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
          HealthCheck:
            Command:
              - CMD-SHELL
              - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=4)" || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

  EcsService:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: !Sub "${ProjectName}-api"
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 90
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Private subnets: outbound via company NAT (ECR + Gemini). No public IP.
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1Id
            - !Ref PrivateSubnet2Id
          SecurityGroups:
            - !Ref ServiceSecurityGroup
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8001
          TargetGroupArn: !Ref TargetGroup
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50

  # ----- UI: S3 + CloudFront -----
  # Private bucket for admin extraction outcome summaries (JSON).
  AuditBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-extract-audit-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldAuditLogs
            Status: Enabled
            ExpirationInDays: 90

  UiBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-ui-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  UiBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UiBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${UiBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName} UI + API proxy"
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Ui
            DomainName: !GetAtt UiBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: AlbApi
            DomainName: !GetAtt ApplicationLoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              # Default max OriginReadTimeout is 60s unless AWS raises the quota.
              # Long Gemini jobs need page ranges (or later custom domain → ALB HTTPS).
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: S3Ui
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: AlbApi
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

Outputs:
  CloudFrontUrl:
    Description: Open this URL for the OmniParse UI (API is same-origin /api/*)
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"

  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution

  CloudFrontDomainName:
    Value: !GetAtt CloudFrontDistribution.DomainName

  AlbDnsName:
    Description: Direct ALB DNS (debug only; prefer CloudFront)
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  EcrRepositoryUri:
    Description: Push API images here
    Value: !GetAtt EcrRepository.RepositoryUri

  EcsClusterName:
    Value: !Ref EcsCluster

  EcsServiceName:
    Value: !GetAtt EcsService.Name

  UiBucketName:
    Value: !Ref UiBucket

  ExtractAuditBucketName:
    Description: S3 bucket for admin AI extraction outcome logs
    Value: !Ref AuditBucket

  SecretArn:
    Value: !Ref AppSecret

  ExistingVpcIdOut:
    Description: Company VPC used by this stack
    Value: !Ref ExistingVpcId

  StackName:
    Value: !Ref AWS::StackName
