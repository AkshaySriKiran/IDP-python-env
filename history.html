<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocuLoom — My extracts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=118">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("idp_theme_v2");
        var theme = (saved === "light" || saved === "dark") ? saved : "light";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="admin-page-body history-page-body">
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <div class="app-container admin-page history-page">
    <header class="app-header">
      <div class="header-logo">
        <div class="logo-icon">
          <img src="assets/idp-logo.png" alt="DocuLoom logo" class="logo-image" width="42" height="50">
        </div>
        <div class="logo-text">
          <h1>DocuLoom</h1>
          <p>My extracts</p>
        </div>
      </div>
      <div class="header-status">
        <a class="btn btn-secondary auth-header-btn auth-back-btn" href="index.html" title="Back to app" aria-label="Back to app">
          <i data-lucide="arrow-left"></i>
        </a>
        <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" title="Switch theme" aria-label="Toggle light and dark mode">
          <i data-lucide="sun" class="theme-icon-sun"></i>
          <i data-lucide="moon" class="theme-icon-moon"></i>
        </button>
        <div class="profile-menu" id="profile-menu" hidden>
          <button type="button" class="profile-trigger" id="profile-trigger" aria-haspopup="true" aria-expanded="false">
            <span class="profile-avatar" id="profile-avatar">U</span>
            <span class="profile-name" id="profile-name">User</span>
            <i data-lucide="chevron-down" class="profile-caret"></i>
          </button>
          <div class="profile-dropdown" id="profile-dropdown" hidden>
            <div class="profile-dropdown-head">
              <div class="profile-dropdown-name" id="profile-dropdown-name">—</div>
              <div class="profile-dropdown-email" id="profile-dropdown-email">—</div>
              <div class="profile-dropdown-meta" id="profile-dropdown-meta">—</div>
            </div>
            <a class="profile-dropdown-item" href="history.html" id="auth-history-btn">
              <i data-lucide="history"></i>
              <span>My extracts</span>
            </a>
            <button type="button" class="profile-dropdown-item" id="auth-admin-btn" hidden>
              <i data-lucide="shield"></i>
              <span>Admin console</span>
            </button>
            <button type="button" class="profile-dropdown-item profile-dropdown-danger" id="auth-logout-btn">
              <i data-lucide="log-out"></i>
              <span>Sign out</span>
            </button>
          </div>
        </div>
        <button type="button" class="btn btn-secondary auth-header-btn" id="auth-login-btn" hidden>Sign in</button>
      </div>
    </header>

    <div class="stats-grid history-stats-grid" id="history-summary" hidden>
      <div class="stat-card">
        <div class="stat-icon-wrapper blue-glow"><i data-lucide="file-stack"></i></div>
        <div class="stat-info">
          <span class="stat-label">Runs</span>
          <h2 class="stat-value" id="hist-runs">0</h2>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon-wrapper green-glow"><i data-lucide="check-circle-2"></i></div>
        <div class="stat-info">
          <span class="stat-label">Successful</span>
          <h2 class="stat-value" id="hist-success">0</h2>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon-wrapper purple-glow"><i data-lucide="rows-3"></i></div>
        <div class="stat-info">
          <span class="stat-label">Rows extracted</span>
          <h2 class="stat-value" id="hist-rows">0</h2>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon-wrapper amber-glow"><i data-lucide="shield-check"></i></div>
        <div class="stat-info">
          <span class="stat-label">Avg quality</span>
          <h2 class="stat-value" id="hist-score">—</h2>
        </div>
      </div>
    </div>

    <section class="admin-page-card glass-card admin-view">
      <div class="admin-section-head">
        <div>
          <h2>Previous extracts</h2>
        </div>
        <div class="history-toolbar" style="display: flex; align-items: center; gap: 0.5rem;">
          <div id="history-admin-scope-wrap" style="display: none; align-items: center; gap: 0.35rem;">
            <label for="history-scope-select" style="font-size: 0.8rem; color: var(--text-muted); font-weight: 500;">Scope:</label>
            <select id="history-scope-select" class="settings-input" style="padding: 0.25rem 0.6rem; font-size: 0.82rem; height: 32px; border-radius: 6px;">
              <option value="mine" selected>My extracts</option>
              <option value="all">All users (Admin)</option>
            </select>
          </div>
          <button type="button" class="btn btn-secondary history-toolbar-control toolbar-icon-btn" id="history-refresh-btn" title="Refresh extracts from Fabric" aria-label="Refresh">
            <i data-lucide="refresh-cw"></i>
          </button>
        </div>
      </div>

      <div class="admin-table-wrap admin-logs-scroll">
        <table class="data-table admin-logs-table">
          <thead>
            <tr>
              <th>When</th>
              <th>Manual</th>
              <th>Engine</th>
              <th>Score</th>
              <th>M / S / T</th>
              <th style="text-align: right; width: 85px;"></th>
            </tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
        <p id="history-detail" class="admin-muted admin-logs-detail" hidden></p>
      </div>

      <div class="grid-footer" style="margin-top: auto; border-top: 1px solid var(--border-glass); padding: 0.55rem 1.25rem; display: flex; align-items: center; justify-content: center; border-radius: 0 0 16px 16px; background: hsla(220, 40%, 6%, 0.15);">
        <p class="grid-disclaimer" style="position: static; transform: none; margin: 0; font-size: 0.78rem; color: hsla(215, 10%, 45%, 0.9); line-height: 1.3; text-align: center;">AI-generated output. Engineer review recommended prior to use</p>
      </div>
    </section>
  </div>

  <!-- Floating Buffer Pop-up Card (same as Front Page) -->
  <div class="progress-overlay" id="history-progress-overlay" role="status" aria-live="polite">
    <div class="progress-drag-handle" id="history-progress-drag-handle" title="Drag to move">
      <span class="progress-drag-grip" aria-hidden="true"></span>
      <span id="history-overlay-tag">PROCESSING</span>
    </div>
    <div class="spinner"></div>
    <h4 id="history-progress-title">Fetching Fabric Extracts</h4>
    <p class="progress-subtext" id="history-progress-status">Querying WH_IDP warehouse logs…</p>
  </div>

  <div id="login-modal" class="auth-modal" hidden>
    <div class="auth-panel" role="dialog" aria-modal="true">
      <div class="auth-panel-header">
        <h3>Sign in</h3>
      </div>
      <form id="login-form" class="auth-form">
        <label>Email<input type="email" id="login-email" class="settings-input" required autocomplete="username"></label>
        <label>Password<input type="password" id="login-password" class="settings-input" required autocomplete="current-password"></label>
        <p id="login-error" class="auth-error"></p>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Sign in</button>
      </form>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
    });
  </script>
  <script src="auth-admin.js?v=52"></script>
</body>
</html>
